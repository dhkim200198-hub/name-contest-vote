<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이름 공모전 투표</title>
    <meta name="robots" content="noindex" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="masthead">
        <div>
          <div class="eyebrow">사내 투표</div>
          <h1 id="title">이름 공모전</h1>
        </div>
        <div class="sub" id="subtitle"></div>
      </header>

      <div class="prize" id="prize" hidden>
        🏆 <span>최종 선정된 이름에는 상금 <b id="prizeAmt"></b> 이 수여됩니다.</span>
      </div>

      <div id="view"><p class="muted"><span class="spin"></span> 불러오는 중…</p></div>

      <p class="mt muted" style="font-size: 0.85rem">
        진행 상황은 <a href="/results">결과 페이지</a>에서 확인할 수 있습니다.
      </p>
    </main>
    <script type="module" src="/vote.js"></script>
  </body>
</html>
