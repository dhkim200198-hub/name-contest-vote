# Render.com 배포 설정 (무료 플랜 + Upstash Redis 로 투표 기록 보존).
# New → Blueprint 에서 이 저장소를 선택하면 자동 적용됩니다.
# 배포 후 대시보드 Environment 에서 아래 3개 값을 입력하세요.
#   - ADMIN_PASSWORD           : 관리자 페이지 비밀번호
#   - UPSTASH_REDIS_REST_URL   : Upstash 데이터베이스의 REST URL
#   - UPSTASH_REDIS_REST_TOKEN : Upstash 데이터베이스의 REST TOKEN
# Upstash 값이 없으면 서버는 뜨지만 무료 플랜이 잠들 때 투표 기록이 사라집니다.
services:
  - type: web
    name: name-contest-vote
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
